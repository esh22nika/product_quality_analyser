[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visionguard"
version = "0.1.0"
description = "VisionGuard: Robust Image and Video-Based Industrial Defect Detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anomalib>=2.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "gradio>=4.0.0",
    "flask>=3.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
