[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visionguard"
version = "0.1.0"
description = "VisionGuard: Robust Image and Video-Based Industrial Defect Detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anomalib==2.7.0",
    "torch>=2.10.0,<2.11",
    "torchvision>=0.25.0,<0.26",
    "gradio==6.18.0",
    "flask>=3.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "imageio-ffmpeg==0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
